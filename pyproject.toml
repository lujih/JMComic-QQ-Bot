[project]
name = "jmcomic-qq-bot"
version = "0.2.0"
description = "QQ bot for JMComic download & AV search"
requires-python = ">=3.10"
authors = [
    {name = "cszx"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "nonebot2[fastapi]>=2.3.0,<2.5.0",
    "nonebot-adapter-onebot>=2.4.0,<3.0.0",
    "nonebot-plugin-apscheduler>=0.5.0,<1.0.0",
    "jmcomic>=2.7.3,<3.0.0",
    "Pillow>=10.4.0,<12.0.0",
    "img2pdf>=0.5.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "scrapling[fetchers]>=0.4.0,<1.0.0",
    "playwright>=1.40.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/lujih/JMComic-QQ-Bot"
Source = "https://github.com/lujih/JMComic-QQ-Bot"
BugReports = "https://github.com/lujih/JMComic-QQ-Bot/issues"
Changelog = "https://github.com/lujih/JMComic-QQ-Bot/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.nonebot]
plugin_dirs = ["src/plugins"]

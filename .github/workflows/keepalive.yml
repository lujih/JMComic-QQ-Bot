name: keepalive

on:
  schedule:
    # UTC 每天 6:00 一次（HF 休眠窗口 48h，24h 间隔足够）
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: curl -sfI -o /dev/null --max-time 60 --retry 3 --retry-delay 20 https://cszx-jmcomic-qq-bot.hf.space/

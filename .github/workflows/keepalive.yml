name: keepalive

on:
  schedule:
    # UTC 每 30 分钟一次，防止 HF Space 48h 无请求休眠
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: curl -sfI -o /dev/null --max-time 60 --retry 3 --retry-delay 20 https://cszx-jmcomic-qq-bot.hf.space/

name: keepalive

on:
  schedule:
    # UTC 每天 6:00 一次（HF 休眠窗口 48h，24h 间隔足够）
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: |
          URL="${{ vars.SPACE_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::SPACE_URL 未设置（fork 部署请在仓库 Settings → Variables 配置自己的 Space URL），跳过本次保活"
            exit 0
          fi
          curl -sfI -o /dev/null --max-time 60 --retry 3 --retry-delay 20 "$URL" && echo "keepalive OK: $URL"
